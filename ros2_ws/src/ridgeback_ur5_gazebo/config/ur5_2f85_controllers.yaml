controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robotiq_2f85_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# -------------------------------------------------------
# Joint State Broadcaster
# -------------------------------------------------------
joint_state_broadcaster:
  ros__parameters:
    joints:
      - ur_arm_shoulder_pan_joint
      - ur_arm_shoulder_lift_joint
      - ur_arm_elbow_joint
      - ur_arm_wrist_1_joint
      - ur_arm_wrist_2_joint
      - ur_arm_wrist_3_joint


# -------------------------------------------------------
# Manipulator Controller (UR5 Arm)
# -------------------------------------------------------
manipulator_controller:
  ros__parameters:
    joints:
      - ur_arm_shoulder_pan_joint
      - ur_arm_shoulder_lift_joint
      - ur_arm_elbow_joint
      - ur_arm_wrist_1_joint
      - ur_arm_wrist_2_joint
      - ur_arm_wrist_3_joint

    command_interfaces: ["position"]
    state_interfaces: ["position", "velocity"]

    # # ✅ Initial joint configuration to face the conveyor
    # initial_positions:
    #   ur_arm_shoulder_pan_joint: 0.0        # Rotate base if needed
    #   ur_arm_shoulder_lift_joint: -1.45     # Lower shoulder ~ -83°
    #   ur_arm_elbow_joint: 1.40              # Raise elbow ~ +80°
    #   ur_arm_wrist_1_joint: 0.0             # Keep straight
    #   ur_arm_wrist_2_joint: -1.57           # Pitch wrist down (face forward)
    #   ur_arm_wrist_3_joint: 0.0             # Keep camera upright


# -------------------------------------------------------
# Gripper Controller
# -------------------------------------------------------
gripper_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
      - robotiq_85_right_finger_joint
    command_interfaces: ["position"]
    state_interfaces: ["position", "velocity"]


# -------------------------------------------------------
# Robotiq 2F-85 Controller
# -------------------------------------------------------
robotiq_2f85_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    command_interfaces: ["position"]
    state_interfaces: ["position", "velocity"]
